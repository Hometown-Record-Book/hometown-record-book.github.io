<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0f1b26">
<style>
  html,body{margin:0;min-height:100%;background:#0f1b26;color:#e9eff3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .load{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
  .load svg{width:56px;height:56px}
  .load b{display:block;margin-top:12px;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
  .load p{margin:8px 0 0;color:#a9b8c4}
  .spin{width:30px;height:30px;border:4px solid rgba(255,255,255,.18);border-top-color:#f3b23a;border-radius:50%;margin:22px auto 0;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="load"><div><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 7.5c4.2-1.6 8.6-1.4 13 1.3v19c-4.4-2.7-8.8-2.9-13-1.3z" fill="#f3b23a"/><path d="M29 7.5c-4.2-1.6-8.6-1.4-13 1.3v19c4.4-2.7 8.8-2.9 13-1.3z" fill="#e9eff3"/><path d="M6 12.5h7M6 16.5h7M6 20.5h7M19 12.5h7M19 16.5h7M19 20.5h7" stroke="#0f1b26" stroke-width="1.6" stroke-linecap="round"/></svg><b>Hometown Record Book</b><p id="msg">Every Season. Every Game. Every Player.</p><div class="spin" id="spin"></div></div></div>
<script>
  // The website itself lives in Google Apps Script (the sales web app). This page loads it from there,
  // so it always shows the latest version. Nothing here needs changing except the link below.
  window.DATA_URL = 'https://script.google.com/macros/s/AKfycbwz-s7PLTprTg7z5scxGpGNjbiNOuIwdP_DEy2huXZpzXS-xRpyhA_ZTI7Nh_g4-2hrgg/exec';
  (function () {
    var started = false;
    window.boot = function (html) {
      if (started) return; started = true;
      document.open(); document.write(html); document.close();
      if (location.hash) setTimeout(function () { var el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }, 300);
    };
    var oops = function () {
      if (started) return; started = true;
      var m = document.getElementById('msg'), sp = document.getElementById('spin');
      if (sp) sp.style.display = 'none';
      if (m) m.innerHTML = 'The page couldn\u2019t load right now. Please refresh in a minute, or email hometownrecordbook@gmail.com.';
    };
    var s = document.createElement('script');
    s.src = window.DATA_URL + '?page=1&callback=boot';
    s.onerror = oops;
    setTimeout(oops, 45000);
    document.head.appendChild(s);
  })();
</script>
</body>
</html>
